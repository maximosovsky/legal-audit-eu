name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install pyyaml
      - name: Validate skill package
        run: python scripts/validate.py
      - name: Compile scanner
        run: python -m py_compile scripts/scan.py
      - name: Scanner smoke test
        run: |
          python scripts/scan.py --jurisdiction eu tests/fixtures/sample-site | tee /tmp/eu-scan.txt
          grep -q "Google Analytics" /tmp/eu-scan.txt
          grep -q "Email field" /tmp/eu-scan.txt
          python scripts/scan.py --jurisdiction uk --include-markdown --include-references --samples . >/tmp/uk-scan.txt
